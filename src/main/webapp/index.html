<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper" id="wrapper">

    <!-- LOGIN -->
    <div class="form-panel login-panel">
        <div class="form-box">

            <h1>Welcome Back</h1>
            <p>Sign in to your account</p>

            <form action="login" method="post">
                <div class="form-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="Email" required>
                </div>

                <div class="form-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <!-- FIXED -->
                <div class="forgot-row">
                    <a href="#" id="forgotLink">Forgot Password?</a>
                </div>

                <!-- HIDDEN BOX -->
                <div id="forgotBox" style="display:none;">
                    <input type="email" id="forgotEmail" placeholder="Enter email">
                    <button type="button" id="sendResetBtn">Send</button>
                </div>

                <button type="submit">Sign In</button>
            </form>

            <p>Don't have an account? <a id="goToSignup">Create one</a></p>

        </div>
    </div>

    <!-- SIGNUP -->
    <div class="form-panel signup-panel">
        <div class="form-box">

            <h1>Create Account</h1>

            <div id="signupError"></div>

            <form action="register" method="post" id="signupForm">
                <input type="text" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="password" name="confirmPassword" placeholder="Confirm Password" required>

                <button type="submit">Create</button>
            </form>

            <p>Already have an account? <a id="goToLogin">Login</a></p>

        </div>
    </div>

    <div class="overlay-panel">
        <div id="overlayContent"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
